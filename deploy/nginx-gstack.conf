# ---------------------------------------------------------------------------
# GStack Browser MCP — snippets for F:\DockerVolumes\ReverseProxy\nginx.conf
# deploy/connect-reverse-proxy.ps1 inserts these (with a timestamped backup).
# Relies on the $client_ip and $connection_upgrade maps already in that file.
# ---------------------------------------------------------------------------

# [1] inside `http { ... }`, next to the existing limit_req_zone:
    limit_req_zone $client_ip zone=gstack:10m rate=30r/s;

# [2] inside the public `server { listen 80; ... }` (reached through Funnel):
        # ---- GStack Browser: API + MCP + laptop tunnel (public via Funnel) ----
        # The admin UI is deliberately NOT routed here (tailnet-only server [3]).
        location = /gstack { return 301 /gstack/; }
        location /gstack/admin { return 404; }
        location /gstack/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $gstack_upstream gstack-browser-mcp:8080;
            limit_req zone=gstack burst=120 nodelay;
            client_max_body_size 50m;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # exec calls, long-polls and the tunnel WebSocket can run for minutes
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_pass http://$gstack_upstream;
        }

# [3] a new server block inside `http { ... }` — tailnet only (serve.json port 10001, NO AllowFunnel):
    server {
        listen 8082;
        server_name _;
        location / {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $gstack_admin gstack-browser-mcp:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;              # live updates (Server-Sent Events)
            proxy_read_timeout 1h;
            proxy_pass http://$gstack_admin;
        }
    }

# [4] tailscale-config/serve.json — add under "TCP" and "Web" (and NOT under "AllowFunnel"):
#   "TCP": { ..., "10001": { "HTTPS": true } }
#   "Web": { ..., "${TS_CERT_DOMAIN}:10001": { "Handlers": { "/": { "Proxy": "http://127.0.0.1:8082" } } } }
#
# [5] docker-compose.yml — tailscale-funnel joins the gstack-edge network:
#   services.tailscale-funnel.networks: + gstack-edge
#   networks: gstack-edge: { external: true }
